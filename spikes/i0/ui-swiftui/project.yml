name: SwiftUIShell
options: { bundleIdPrefix: app.granger.i0, deploymentTarget: { iOS: "26.0" } }
targets:
  SwiftUIShell:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_FILE: Info.plist
        FRAMEWORK_SEARCH_PATHS: ["$(SRCROOT)/../kmp-core/shared/build/bin/iosSimulatorArm64/debugFramework"]
        OTHER_LDFLAGS: ["-framework", "Shared", "-lc++"]
        CODE_SIGNING_ALLOWED: NO
