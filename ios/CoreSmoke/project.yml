# Plan I1 Task 8: the smallest app over GrangerCore. I2's real app replaces it. Regenerate with `xcodegen` in this folder.
name: CoreSmoke
options:
  deploymentTarget: { iOS: "26.0" }
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  GrangerCore:
    path: ../GrangerCore
targets:
  CoreSmoke:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ../../catalog/catalog.json
        buildPhase: resources
      - path: ../../catalog/catalog.json.sig
        buildPhase: resources
      - path: ../../catalog/public-key.txt
        buildPhase: resources
    dependencies:
      - package: GrangerCore
        product: GrangerCoreKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GRANGER_BUNDLE_PREFIX).coresmoke
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: CoreSmoke
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # GrangerCore ships arm64 slices only (Apple-silicon Macs and iPhones).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
