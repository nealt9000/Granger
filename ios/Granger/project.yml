# Granger for iPhone (spec docs/superpowers/specs/2026-11-20-iphone-design.md). Regenerate with `xcodegen` in this
# folder after changing this file; the generated project is committed so a clone needs only Xcode.
name: Granger
options:
  deploymentTarget: { iOS: "26.0" }
  bundleIdPrefix: app.granger
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  GrangerCore:
    path: ../GrangerCore
  # E-books (Plan I5 call 1): Readium's Swift toolkit, the same family as Android's Kotlin toolkit. BSD-3.
  Readium:
    url: https://github.com/readium/swift-toolkit
    exactVersion: 3.11.1
settings:
  base:
    # The Swift 6 toolchain in language mode 5: Kotlin's exported types aren't Sendable.
    SWIFT_VERSION: "5.0"
    # GrangerCore ships arm64 slices only (Apple-silicon Macs and iPhones).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  Granger:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        excludes: ["Fonts"]
      - path: Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: GrangerCore
        product: GrangerCoreKit
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      # Kiwix's libkiwix 14.2.1 (Plan I4 Task 5): static, fetched by tools/ios/fetch-corekiwix.sh, not in git.
      - framework: ../Vendor/CoreKiwix.xcframework
        embed: false
      # libarchive 3.8.1's RAR reader for CBR comics (Plan I5 call 6): static, built by tools/ios/fetch-libarchive.sh, not in git.
      - framework: ../Vendor/libarchive.xcframework
        embed: false
      # TagLib 2.3.2 for MP3 tags (Plan I6 call 3, Task 6's spike): static, built from Android's submodule by
      # tools/ios/build-taglib.sh, not in git.
      - framework: ../Vendor/taglib.xcframework
        embed: false
      # sherpa-onnx 1.13.8 with onnxruntime inside, for the Piper voices (Plan I5 call 3): dynamic, fetched by
      # tools/ios/fetch-sherpa-onnx.sh, not in git.
      - framework: ../Vendor/SherpaOnnxC.xcframework
        embed: true
      - sdk: libc++.tbd
      - sdk: libz.tbd
      # The player widget and the Local only control (Plan I6 Task 8, call 7).
      - target: GrangerWidgets
    info:
      path: Info.plist
      properties:
        # Xcode has no generated-plist key for fonts; the rest of the plist is generated from INFOPLIST_KEY_*.
        UIAppFonts: [spectral_regular.ttf, spectral_medium.ttf, spectral_semibold.ttf, spectral_italic.ttf]
        # Documents shows in the Files app (On My iPhone › Granger): packs are yours to see, copy and delete (Plan I4).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Read aloud goes on with the screen locked (Plan I5 call 4).
        UIBackgroundModes: [audio]
        # The app group the widget extension shares (Plan I6 call 7), read by both targets' code.
        GrangerAppGroup: group.$(GRANGER_BUNDLE_PREFIX)
        # CarPlay audio (Plan I6 call 6): the scene CarPlay connects. SwiftUI makes the phone's own window scene.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlayScene
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GRANGER_BUNDLE_PREFIX)
        PRODUCT_NAME: Granger
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Granger
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Music library access (Plan I6 call 2): its songs that aren't protected play from Listen's Music.
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "Granger lists the songs in your Music library that it can play, beside the music you add from Files. It never changes them."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Kiwix/Granger-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        # The app group (call 7). CarPlay audio's entitlement (call 6) isn't granted yet (Neal requests it for I8), so only
        # Simulator builds carry it; once Apple grants it, it goes into Granger.entitlements and the Simulator file goes.
        CODE_SIGN_ENTITLEMENTS: Granger.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Granger-Simulator.entitlements
  GrangerWidgets:
    type: app-extension
    platform: iOS
    # The shared folder holds the snapshot, Local only's key and the intents both targets know; no Kotlin core here.
    sources:
      - Widgets
      - Sources/Shared
    info:
      path: Widgets/Info.plist
      properties:
        GrangerAppGroup: group.$(GRANGER_BUNDLE_PREFIX)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GRANGER_BUNDLE_PREFIX).widgets
        PRODUCT_NAME: GrangerWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Granger
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Widgets/GrangerWidgets.entitlements
  GrangerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(GRANGER_BUNDLE_PREFIX).tests
    dependencies:
      - target: Granger
  GrangerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(GRANGER_BUNDLE_PREFIX).uitests
        TEST_TARGET_NAME: Granger
    dependencies:
      - target: Granger
schemes:
  Granger:
    build:
      targets:
        Granger: all
        GrangerTests: [test]
        GrangerUITests: [test]
    test:
      targets: [GrangerTests, GrangerUITests]
