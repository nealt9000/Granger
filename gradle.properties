# Sized for the Mac Studio (M2 Max, 12 cores, 64 GB), 2026-11-02. Several sessions and worktrees can build at once,
# each with its own daemons, so the heaps stay moderate. On a small machine (the old 5.7 GB Linux box) go back to
# -Xmx2g, org.gradle.workers.max=2 and kotlin.compiler.execution.strategy=in-process.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx4g
android.useAndroidX=true
kotlin.code.style=official
